<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Guide — Piquant IA</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="logo.svg" />
<style>
  :root {
    --bg: #151210;
    --card: #1c1712;
    --amber: #f4a259;
    --amber-bright: #ffd9a8;
    --text: #e9ded1;
    --text-dim: #b8a892;
    --border: rgba(233,193,154,0.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    line-height: 1.6;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }
  .back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--amber);
    text-decoration: none;
    font-size: 0.9rem;
    margin-bottom: 24px;
  }
  .back:hover { color: var(--amber-bright); }
  h1 {
    font-family: 'Fraunces', serif;
    font-size: 2rem;
    margin: 0 0 8px;
  }
  h1 em { color: var(--amber); font-style: italic; }
  .subtitle {
    color: var(--text-dim);
    font-size: 1rem;
    margin: 0 0 36px;
    max-width: 50ch;
  }
  .feature-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 22px;
    margin-bottom: 16px;
    opacity: 0;
    transform: translateY(10px);
    animation: card-in 0.5s ease forwards;
  }
  @keyframes card-in {
    to { opacity: 1; transform: translateY(0); }
  }
  .feature-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }
  .feature-icon {
    font-size: 1.5rem;
    line-height: 1;
  }
  .feature-title {
    font-family: 'Fraunces', serif;
    font-size: 1.15rem;
    font-weight: 600;
    margin: 0;
  }
  .feature-desc {
    color: var(--text-dim);
    font-size: 0.92rem;
    margin: 0 0 12px;
  }
  .example-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(233,193,154,0.4);
    margin-bottom: 6px;
  }
  .example-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(244,162,89,0.07);
    border: 1px solid rgba(244,162,89,0.18);
    color: var(--text);
    font-size: 0.85rem;
    padding: 7px 12px;
    border-radius: 999px;
    margin: 0 6px 6px 0;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .example-chip:hover {
    background: rgba(244,162,89,0.14);
    border-color: rgba(244,162,89,0.4);
  }
  .example-chip .copy-icon { opacity: 0.5; font-size: 0.75rem; }
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--amber);
    color: #1a1109;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .loading, .error-state {
    color: var(--text-dim);
    font-size: 0.9rem;
    text-align: center;
    padding: 40px 0;
  }
</style>
</head>
<body>

<div class="wrap">
  <a class="back" href="index.html">&larr; Retour à Piquant</a>

  <h1>Le <em>guide</em> de Piquant</h1>
  <p class="subtitle">Tout ce que Piquant sait faire, avec des exemples de messages à copier-coller directement dans le chat.</p>

  <div id="featureList">
    <div class="loading">Chargement du guide...</div>
  </div>
</div>

<div class="toast" id="toast">Copié dans le presse-papiers !</div>

<script>
  const list = document.getElementById('featureList');
  const toast = document.getElementById('toast');

  function showToast() {
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1600);
  }

  function copyText(text) {
    navigator.clipboard.writeText(text).then(showToast).catch(() => {
      // Repli si le presse-papiers est indisponible
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast();
    });
  }

  fetch('/api/features')
    .then((r) => r.json())
    .then((data) => {
      const features = data.features || [];
      if (!features.length) {
        list.innerHTML = '<div class="error-state">Aucune fonctionnalité à afficher pour le moment.</div>';
        return;
      }
      list.innerHTML = '';
      features.forEach((f, i) => {
        const card = document.createElement('div');
        card.className = 'feature-card';
        card.style.animationDelay = (i * 0.06) + 's';

        const examplesHtml = (f.examples && f.examples.length)
          ? `<div class="example-label">Essaie par exemple</div>` +
            f.examples.map((ex) =>
              `<button class="example-chip" data-text="${ex.replace(/"/g, '&quot;')}">${ex} <span class="copy-icon">⧉</span></button>`
            ).join('')
          : '';

        card.innerHTML = `
          <div class="feature-head">
            <span class="feature-icon">${f.icon || '✨'}</span>
            <h2 class="feature-title">${f.title}</h2>
          </div>
          <p class="feature-desc">${f.description}</p>
          ${examplesHtml}
        `;
        list.appendChild(card);
      });

      list.querySelectorAll('.example-chip').forEach((btn) => {
        btn.addEventListener('click', () => copyText(btn.dataset.text));
      });
    })
    .catch(() => {
      list.innerHTML = '<div class="error-state">Impossible de charger le guide pour le moment. Réessaie dans un instant.</div>';
    });
</script>

</body>
</html>
