<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Piquant — l'assistant qui va droit au but</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="logo.svg" />
<link rel="stylesheet" href="style.css" />
<style>
  /* --- Icône hérisson animée (remplace logo.svg dans le header) --- */
  .hedgehog-icon-wrap {
    position: relative;
    width: 34px;
    height: 34px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .hedgehog-icon-wrap svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }

  #hh-hedgehog {
    transform-origin: 60px 68px;
    animation: hh-breathe 3s ease-in-out infinite;
  }
  @keyframes hh-breathe {
    0%, 100% { transform: scale(1) translateY(0); }
    50%      { transform: scale(1.015, 0.985) translateY(1px); }
  }

  .hh-spike {
    transform-origin: bottom center;
    animation: hh-fur 2.2s ease-in-out infinite;
  }
  @keyframes hh-fur {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(1.5deg); }
  }

  .hh-leg-front { transform-origin: top center; animation: hh-walk1 1.1s ease-in-out infinite; }
  .hh-leg-back  { transform-origin: top center; animation: hh-walk2 1.1s ease-in-out infinite; }
  @keyframes hh-walk1 { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
  @keyframes hh-walk2 { 0%,100% { transform: rotate(6deg); } 50% { transform: rotate(-6deg); } }

  .hh-eye { animation: hh-blink 4.5s infinite; transform-origin: center; }
  @keyframes hh-blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95%           { transform: scaleY(0.15); }
  }

  .hh-snout-group { transform-origin: 8px 60px; animation: hh-sniff 2.6s ease-in-out infinite; }
  @keyframes hh-sniff {
    0%, 100% { transform: translateX(0); }
    50%      { transform: translateX(-1.2px); }
  }

  .hedgehog-icon-wrap:hover #hh-hedgehog {
    animation-play-state: paused;
    transform: scale(0.88) translateY(6px);
    transition: transform 0.45s cubic-bezier(.34,1.56,.64,1);
  }
  .hedgehog-icon-wrap:hover .hh-spike { animation-play-state: paused; }
  .hedgehog-icon-wrap:hover .hh-leg-front,
  .hedgehog-icon-wrap:hover .hh-leg-back {
    animation-play-state: paused;
    transform: rotate(35deg) translateY(4px);
    transition: transform 0.4s ease;
  }
  .hedgehog-icon-wrap:hover .hh-snout-group {
    animation-play-state: paused;
    transform: translate(10px, 4px) scale(0.85);
    transition: transform 0.4s ease;
  }

  .hedgehog-icon-wrap.hh-clicked #hh-hedgehog {
    animation: hh-startle 0.35s ease;
  }
  @keyframes hh-startle {
    0%   { transform: translateY(0) scale(1); }
    30%  { transform: translateY(-4px) scale(1.05, 0.95); }
    60%  { transform: translateY(1px) scale(0.97, 1.03); }
    100% { transform: translateY(0) scale(1); }
  }
</style>
</head>
<body>

<div class="bg-ambient" aria-hidden="true">

    <span class="bg-spark" style="left:53.3%; top:37.6%; animation-duration:9.4s; animation-delay:5.1s;"></span>
    <span class="bg-spark" style="left:7.4%; top:43.9%; animation-duration:9.5s; animation-delay:0.9s;"></span>
    <span class="bg-spark" style="left:43.1%; top:80.1%; animation-duration:9.9s; animation-delay:2.2s;"></span>
    <span class="bg-spark" style="left:61.7%; top:91.2%; animation-duration:13.0s; animation-delay:4.0s;"></span>
    <span class="bg-spark" style="left:93.8%; top:8.3%; animation-duration:15.0s; animation-delay:2.9s;"></span>
    <span class="bg-spark" style="left:17.3%; top:14.8%; animation-duration:11.2s; animation-delay:8.2s;"></span>
    <span class="bg-spark" style="left:20.6%; top:57.5%; animation-duration:13.5s; animation-delay:3.7s;"></span>
    <span class="bg-spark" style="left:54.4%; top:9.8%; animation-duration:9.4s; animation-delay:2.1s;"></span>
    <span class="bg-spark" style="left:66.6%; top:43.3%; animation-duration:11.2s; animation-delay:5.9s;"></span>
    <span class="bg-spark" style="left:45.7%; top:31.6%; animation-duration:14.6s; animation-delay:7.0s;"></span>
    <span class="bg-spark" style="left:26.5%; top:56.8%; animation-duration:12.7s; animation-delay:8.8s;"></span>
    <span class="bg-spark" style="left:71.1%; top:30.5%; animation-duration:15.9s; animation-delay:1.2s;"></span>
    <span class="bg-spark" style="left:42.5%; top:73.7%; animation-duration:10.1s; animation-delay:4.9s;"></span>
    <span class="bg-spark" style="left:7.6%; top:65.5%; animation-duration:14.4s; animation-delay:5.7s;"></span>

</div>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark hedgehog-icon-wrap" id="hedgehogIcon" aria-hidden="true">
        <svg viewBox="0 0 120 120">
          <defs>
            <linearGradient id="hhBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#e9c19a"/>
              <stop offset="55%" stop-color="#cf9a68"/>
              <stop offset="100%" stop-color="#a9754b"/>
            </linearGradient>
            <linearGradient id="hhSpikeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#c9531c"/>
              <stop offset="100%" stop-color="#8a3e18"/>
            </linearGradient>
            <radialGradient id="hhSnoutGrad" cx="30%" cy="30%" r="80%">
              <stop offset="0%" stop-color="#e3ad7c"/>
              <stop offset="100%" stop-color="#b17f52"/>
            </radialGradient>
          </defs>

          <g id="hh-hedgehog">
            <g stroke="url(#hhSpikeGrad)" stroke-width="2.6" stroke-linecap="round">
              <line class="hh-spike" x1="34" y1="46" x2="26" y2="26"/>
              <line class="hh-spike" x1="38" y1="40" x2="32" y2="18"/>
              <line class="hh-spike" x1="43" y1="35" x2="40" y2="12"/>
              <line class="hh-spike" x1="49" y1="31" x2="48" y2="8"/>
              <line class="hh-spike" x1="55" y1="29" x2="56" y2="6"/>
              <line class="hh-spike" x1="61" y1="28" x2="64" y2="6"/>
              <line class="hh-spike" x1="67" y1="29" x2="72" y2="8"/>
              <line class="hh-spike" x1="73" y1="31" x2="80" y2="11"/>
              <line class="hh-spike" x1="79" y1="35" x2="88" y2="17"/>
              <line class="hh-spike" x1="84" y1="40" x2="95" y2="25"/>
              <line class="hh-spike" x1="88" y1="47" x2="101" y2="35"/>
              <line class="hh-spike" x1="91" y1="55" x2="105" y2="46"/>
              <line class="hh-spike" x1="93" y1="63" x2="108" y2="58"/>
              <line class="hh-spike" x1="93" y1="71" x2="108" y2="71"/>
              <line class="hh-spike" x1="91" y1="78" x2="105" y2="83"/>
              <line class="hh-spike" x1="87" y1="84" x2="99" y2="94"/>
              <line class="hh-spike" x1="30" y1="55" x2="18" y2="40"/>
              <line class="hh-spike" x1="28" y1="63" x2="14" y2="52"/>
              <line class="hh-spike" x1="27" y1="71" x2="11" y2="65"/>
              <line class="hh-spike" x1="27" y1="78" x2="11" y2="79"/>
            </g>

            <path d="M28 60
                     C 20 68, 18 84, 28 96
                     C 38 108, 62 110, 78 100
                     C 96 90, 100 68, 90 52
                     C 82 40, 66 34, 50 38
                     C 40 40, 32 48, 28 60 Z"
                  fill="url(#hhBodyGrad)"/>

            <path d="M35 88 C 48 100, 70 100, 82 90 C 76 98, 60 103, 46 100 C 40 98, 36 94, 35 88 Z"
                  fill="#8a5c37" opacity="0.35"/>

            <ellipse class="hh-leg-back"  cx="45" cy="103" rx="6" ry="4" fill="#b98254"/>
            <ellipse class="hh-leg-front" cx="62" cy="106" rx="6" ry="4" fill="#b98254"/>
            <ellipse class="hh-leg-back"  cx="79" cy="102" rx="6" ry="4" fill="#b98254"/>

            <g class="hh-snout-group">
              <path d="M28 63 C 16 60, 6 64, 2 70 C 6 75, 16 76, 26 71 Z" fill="url(#hhSnoutGrad)"/>
              <circle cx="4" cy="70" r="2.6" fill="#2a1c12"/>
              <line x1="10" y1="68" x2="-4" y2="63" stroke="#2a1c12" stroke-width="0.8" opacity="0.6"/>
              <line x1="10" y1="71" x2="-5" y2="71" stroke="#2a1c12" stroke-width="0.8" opacity="0.6"/>
              <line x1="10" y1="74" x2="-4" y2="79" stroke="#2a1c12" stroke-width="0.8" opacity="0.6"/>
            </g>

            <ellipse class="hh-eye" cx="34" cy="58" rx="3.4" ry="3.8" fill="#2a1c12"/>
            <circle cx="35.5" cy="56.5" r="1.1" fill="#fff" opacity="0.85"/>

            <path d="M40 44 C 38 38, 44 34, 48 38 C 48 42, 44 46, 40 44 Z" fill="#b98254"/>
          </g>
        </svg>
      </span>
      <span class="brand-name">Piquant</span>
    </div>
    <button class="btn-ghost" id="resetBtn" title="Effacer la conversation">Nouvelle conversation</button>
  </header>

  <main class="stage">

    <section id="intro" class="intro">
      <div class="mandala" aria-hidden="true">
        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="ring r3"></div>
        <div class="quill" style="--i:0"></div>
        <div class="quill" style="--i:1"></div>
        <div class="quill" style="--i:2"></div>
        <div class="quill" style="--i:3"></div>
        <div class="quill" style="--i:4"></div>
        <div class="quill" style="--i:5"></div>
        <div class="quill" style="--i:6"></div>
        <div class="quill" style="--i:7"></div>
        <div class="quill" style="--i:8"></div>
        <div class="quill" style="--i:9"></div>
        <div class="quill" style="--i:10"></div>
        <div class="quill" style="--i:11"></div>
        <div class="quill" style="--i:12"></div>
        <div class="quill" style="--i:13"></div>
        <div class="quill" style="--i:14"></div>
        <div class="quill" style="--i:15"></div>
        <div class="quill" style="--i:16"></div>
        <div class="quill" style="--i:17"></div>
        <div class="quill" style="--i:18"></div>
        <div class="quill" style="--i:19"></div>
        <div class="quill" style="--i:20"></div>
        <div class="quill" style="--i:21"></div>
        <div class="quill" style="--i:22"></div>
        <div class="quill" style="--i:23"></div>
        <div class="core"></div>
      </div>
      <h1>Une question&nbsp;? <em>Pose-la.</em></h1>
      <p class="lede">Piquant est un assistant qui répond droit au but — pas de détour, pas de blabla. Écris ce que tu cherches, ci-dessous.</p>
      <div class="prompt-chips">
        <button class="chip" data-prompt="Explique-moi un sujet compliqué simplement">Explique-moi un sujet compliqué</button>
        <button class="chip" data-prompt="Aide-moi à rédiger un message">Aide-moi à rédiger un message</button>
        <button class="chip" data-prompt="Donne-moi des idées créatives">Donne-moi des idées créatives</button>
      </div>
    </section>

    <section id="thread" class="thread" aria-live="polite"></section>

  </main>

  <footer class="composer-bar">
    <form id="composerForm" class="composer">
      <textarea
        id="composerInput"
        placeholder="Écris ton message…"
        rows="1"
        autocomplete="off"
      ></textarea>
      <button type="submit" id="sendBtn" class="send-btn" aria-label="Envoyer">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
          <path d="M4 12h15M13 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>
    <p class="disclaimer">Piquant peut se tromper. Vérifie les informations importantes.</p>
    <p class="credit">Créé par <span>Rahim Batchabi</span></p>
  </footer>

</div>

<script>
  document.getElementById('hedgehogIcon').addEventListener('click', function () {
    this.classList.add('hh-clicked');
    setTimeout(() => this.classList.remove('hh-clicked'), 350);
  });
</script>
<script src="script.js"></script>
</body>
</html>
